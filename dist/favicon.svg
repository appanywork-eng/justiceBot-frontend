<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="-7 -7 122 122"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">PetitionDesk</title>

  <desc id="description">
    A bold legal technology shield containing a petition document,
    digital circuit connections and a gold writing mark.
  </desc>

  <defs>
    <linearGradient
      id="shield"
      x1="20"
      y1="8"
      x2="89"
      y2="101"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0"
        stop-color="#08734d"
      />

      <stop
        offset="0.55"
        stop-color="#03543c"
      />

      <stop
        offset="1"
        stop-color="#022f25"
      />
    </linearGradient>

    <linearGradient
      id="gold"
      x1="54"
      y1="39"
      x2="82"
      y2="83"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0"
        stop-color="#f3d77d"
      />

      <stop
        offset="1"
        stop-color="#b37b18"
      />
    </linearGradient>

    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="170%"
    >
      <feDropShadow
        dx="0"
        dy="7"
        stdDeviation="6"
        flood-color="#01271d"
        flood-opacity="0.3"
      />
    </filter>
  </defs>

  <g
    fill="none"
    stroke="#08734d"
    stroke-linecap="round"
