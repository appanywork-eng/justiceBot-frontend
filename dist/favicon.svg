    <path d="M9 32h13l8 8" />
    <path d="M7 49h14l8 1" />
    <path d="M9 66h13l8-8" />

    <circle
      cx="7"
      cy="32"
      r="4"
      fill="#ffffff"
    />

    <circle
      cx="5"
      cy="49"
      r="4"
      fill="#ffffff"
    />

    <circle
      cx="7"
      cy="66"
      r="4"
      fill="#ffffff"
    />
  </g>

  <path
    d="M55 6 94 21v29c0 26-15.6 44.6-39 53C31.6 94.6 16 76 16 50V21L55 6Z"
